
cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = [
    "reitero_video/reitero_decode",
    "reitero_video/reitero_encode",
    "reitero_video/reitero_residual",
    "reitero_video/reitero_video_common",
    "reitero_video_tools",
    "reitero_video_quality_test",
    "reitero_video/reitero_dct"
]

[profile.dev]
opt-level = 1

# Keep the workspace default `release` behavior unchanged, but build `ri-cli`
# (the `reitero_video_tools` package) as aggressively as possible in release.
[profile.release.package.reitero_video_tools]
opt-level = 3
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false

# Optional "fast" profile for `ri-cli` that additionally uses target-cpu=native.
# Use via: cargo ri-cli-fast
[profile.fast-dev]
inherits = "dev"
opt-level = 3
codegen-units = 1
strip = "none"
debug = true
incremental = false
rustflags = ["-C", "target-cpu=native"]

[profile.full-opt]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
rustflags = ["-C", "target-cpu=native"]

