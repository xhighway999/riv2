[package]
name = "reitero_video_quality_test"
version = "0.1.0"
edition = "2024"

[features]
default = ["simd", "threads"]
simd = ["wide", "reitero_encode/simd"]
threads = ["reitero_encode/threads"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ffmpeg-next = "8"
reitero_encode = { path = "../reitero_video/reitero_encode" }
reitero_decode = { path = "../reitero_video/reitero_decode" }
reitero_video_common = { path = "../reitero_video/reitero_video_common" }
reitero_residual = { path = "../reitero_video/reitero_residual" }
dssim-core = "3"
rgb = "0.8"
wide = { version = "1.1", optional = true }

[[bin]]
name = "ri-quality"
path = "src/main.rs"
