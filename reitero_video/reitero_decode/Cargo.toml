[package]
name = "reitero_decode"
version = "0.1.0"
edition = "2024"

[lib]
name = "reitero_decode"
crate-type = ["rlib"]

[features]
default = ["simd"]
simd = ["wide"]

[dependencies]
thiserror = "1.0"
reitero_video_common = { path = "../reitero_video_common" }
reitero_residual = { path = "../reitero_residual" }
wide = { version = "1.1", optional = true }

