[package]
name = "reitero_decode"
version = "0.1.1"
edition = "2024"
license = "Unlicense OR MIT"
authors = ["Quentin Kammann"]
description = "Decoder for the Reitero video format"
readme = "README.md"
repository = "https://github.com/xhighway999/riv"
keywords = ["video", "codec", "decoder", "reitero", "compression"]
categories = ["multimedia::video", "multimedia::encoding"]

[lib]
name = "reitero_decode"
crate-type = ["rlib"]

[features]
default = ["simd"]
simd = ["wide"]

[dependencies]
chrono = "0.4"
thiserror = "1.0"
reitero_video_common = { path = "../reitero_video_common" }
reitero_residual = { path = "../reitero_residual" }
wide = { version = "1.1", optional = true }

