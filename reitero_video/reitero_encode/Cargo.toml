[package]
name = "reitero_encode"
version = "0.1.0"
edition = "2024"
license = "Unlicense OR MIT"
authors = ["Quentin Kammann"]
description = "Encoder for the Reitero video format"
readme = "README.md"
repository = "https://github.com/xhighway999/riv"
keywords = ["video", "codec", "encoder", "reitero", "compression"]
categories = ["multimedia::video", "multimedia::encoding"]

[lib]
name = "reitero_encode"
crate-type = ["rlib"]

[features]
default = ["simd"]
simd = ["wide"]
threads = ["dep:rayon", "reitero_residual/threads"]

[dependencies]
thiserror = "1.0"
reitero_video_common = { path = "../reitero_video_common" }
reitero_residual = { path = "../reitero_residual" }
wide = { version = "1.1", optional = true }
rayon = { version = "1.8", optional = true }

[dev-dependencies]
criterion = { version = "0.8" }

[[bench]]
name = "build_pred"
harness = false